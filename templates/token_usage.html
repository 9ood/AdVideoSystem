<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 用量统计</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="page stack">
        <section class="panel panel-body hero">
            <div class="hero-top">
                <div>
                    <div class="eyebrow">AdVideoSystem</div>
                    <h1 class="page-title">Token 用量统计</h1>
                    <p class="paragraph">这里用来看这套翻拍系统的总消耗、今天消耗，以及最近一次次调用记录。</p>
                </div>
                <div class="hero-actions">
                    <span class="badge accent">统计页</span>
                    <a class="btn btn-secondary" href="/">返回翻拍系统</a>
                </div>
            </div>
        </section>

        <section class="panel panel-body">
            <strong class="title">汇总</strong>
            <div class="records" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
                <div class="record-card">
                    <strong>总输入 Tokens</strong>
                    <div class="mono" id="total-input">0</div>
                </div>
                <div class="record-card">
                    <strong>总输出 Tokens</strong>
                    <div class="mono" id="total-output">0</div>
                </div>
                <div class="record-card">
                    <strong>总费用 (USD)</strong>
                    <div class="mono" id="total-cost">0</div>
                </div>
                <div class="record-card">
                    <strong>今日费用 (USD)</strong>
                    <div class="mono" id="today-cost">0</div>
                </div>
            </div>
        </section>

        <section class="panel panel-body">
            <strong class="title">最近记录</strong>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>动作</th>
                            <th>模型</th>
                            <th>输入</th>
                            <th>输出</th>
                            <th>费用</th>
                        </tr>
                    </thead>
                    <tbody id="records">
                        <tr>
                            <td colspan="6" class="muted">还没有记录</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        function renderNumber(value) {
            return Number(value || 0).toLocaleString("zh-CN");
        }

        function renderCost(value) {
            return Number(value || 0).toFixed(6);
        }

        async function loadTokenUsage() {
            const response = await fetch("/token_usage");
            const data = await response.json();

            document.getElementById("total-input").textContent = renderNumber(data.total.input_tokens);
            document.getElementById("total-output").textContent = renderNumber(data.total.output_tokens);
            document.getElementById("total-cost").textContent = renderCost(data.total.cost_usd);
            document.getElementById("today-cost").textContent = renderCost(data.today.cost_usd);

            const tbody = document.getElementById("records");
            if (!data.records || data.records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="muted">还没有记录</td></tr>';
                return;
            }

            tbody.innerHTML = data.records.map((record) => `
                <tr>
                    <td>${record.time || ""}</td>
                    <td>${record.action || ""}</td>
                    <td>${record.model || ""}</td>
                    <td>${renderNumber(record.input_tokens)}</td>
                    <td>${renderNumber(record.output_tokens)}</td>
                    <td>${renderCost(record.cost_usd)}</td>
                </tr>
            `).join("");
        }

        loadTokenUsage().catch(() => {
            document.getElementById("records").innerHTML =
                '<tr><td colspan="6" class="muted">读取失败，请稍后再试</td></tr>';
        });
    </script>
</body>
</html>
