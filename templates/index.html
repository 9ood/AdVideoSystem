<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频翻拍系统 - AdVideoSystem</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 视频翻拍系统</h1>
            <p class="subtitle">AI 驱动的视频分析与脚本生成</p>
        </header>

        <main>
            <div class="upload-section" id="uploadSection">
                <div class="upload-box">
                    <div class="upload-icon">📹</div>
                    <h2>上传视频</h2>
                    <p>支持 MP4, MOV, AVI, MKV 格式</p>
                    <input type="file" id="videoInput" accept="video/*" style="display: none;">
                    <button class="btn btn-primary" onclick="document.getElementById('videoInput').click()">
                        选择视频文件
                    </button>
                    <p class="file-name" id="fileName"></p>
                </div>
            </div>

            <div class="processing-section" id="processingSection" style="display: none;">
                <div class="progress-box">
                    <h2>处理中...</h2>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">正在上传视频...</p>
                    <div class="spinner"></div>
                </div>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <div class="result-box">
                    <div class="success-icon">✅</div>
                    <h2>处理完成！</h2>
                    <div class="result-info">
                        <p>检测到 <strong id="sceneCount">0</strong> 个镜头</p>
                        <p>已生成 Sora 脚本和关键帧图片</p>
                    </div>
                    <button class="btn btn-success" id="downloadBtn">
                        📥 下载结果文件
                    </button>
                    <button class="btn btn-secondary" onclick="location.reload()">
                        🔄 处理新视频
                    </button>
                </div>
            </div>

            <div class="error-section" id="errorSection" style="display: none;">
                <div class="error-box">
                    <div class="error-icon">❌</div>
                    <h2>处理失败</h2>
                    <p class="error-message" id="errorMessage"></p>
                    <button class="btn btn-secondary" onclick="location.reload()">
                        🔄 重新开始
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by OpenRouter + Gemini 3 Flash</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
